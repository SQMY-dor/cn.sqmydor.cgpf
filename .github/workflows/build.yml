name: Build

on:
  push:
    branches-ignore: [dist]
    tags-ignore: ['**']
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: android-actions/setup-android@v3
      - name: Install SDK packages
        run: sdkmanager "platforms;android-37.0" "build-tools;37.0.0"
      - uses: gradle/actions/setup-gradle@v4
      - name: Decode signing key (optional)
        if: ${{ env.KEYSTORE_BASE64 != '' }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > $RUNNER_TEMP/release.jks
          echo "CGPF_KEYSTORE=$RUNNER_TEMP/release.jks" >> $GITHUB_ENV
      - name: Build release APK
        env:
          CGPF_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          CGPF_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          CGPF_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew --no-daemon assembleRelease
      - uses: actions/upload-artifact@v4
        with:
          name: CGPF-Merged-release
          path: app/build/outputs/apk/release/*.apk
